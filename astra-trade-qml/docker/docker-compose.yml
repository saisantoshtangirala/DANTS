# Always run this with --project-directory pointed at the astra-trade-qml
# root (not the docker/ directory this file lives in), from the repo root:
#   docker compose -f docker/docker-compose.yml --project-directory . up -d
# Without --project-directory, Compose resolves build.context and the
# ./models /./data /./logs volumes relative to *this file's* directory
# (docker/), not the project root, which silently puts everything one
# level in the wrong place. scripts/deploy_to_hetzner.sh already invokes
# it correctly.
version: '3.8'

services:
  # Local training (optional - for a home/on-prem GPU box). The real
  # CI/CD pipeline trains on a rented RunPod GPU instead (see
  # .github/workflows/train-and-deploy.yml + scripts/ci/); this service
  # is only useful if you want to run training locally against your own
  # GPU rather than RunPod.
  astra-training:
    build:
      context: .
      dockerfile: docker/Dockerfile.training
    image: astra-trade-qml:training
    container_name: astra-training
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - KITE_API_KEY=${KITE_API_KEY:-}
      - KITE_API_SECRET=${KITE_API_SECRET:-}
      - KITE_USER_ID=${KITE_USER_ID:-}
      - KITE_PASSWORD=${KITE_PASSWORD:-}
      - KITE_TOTP_SECRET=${KITE_TOTP_SECRET:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
      - ./checkpoints:/app/checkpoints
    command: python3 -m src.main --mode train
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Paper Trading Service (Hetzner - CPU). Deployed by
  # scripts/deploy_to_hetzner.sh, which syncs a freshly trained model
  # into ./models/latest and restarts this service - it does not depend
  # on astra-training running locally.
  astra-paper:
    build:
      context: .
      dockerfile: docker/Dockerfile.papertrading
    image: astra-trade-qml:paper
    container_name: astra-paper
    environment:
      - KITE_API_KEY=${KITE_API_KEY:-}
      - KITE_API_SECRET=${KITE_API_SECRET:-}
      - KITE_USER_ID=${KITE_USER_ID:-}
      - KITE_PASSWORD=${KITE_PASSWORD:-}
      - KITE_TOTP_SECRET=${KITE_TOTP_SECRET:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    command: python3 -m src.main --mode paper
    restart: unless-stopped

  # Dashboard (the only service that actually serves HTTP - astra-paper
  # runs headless, so they don't compete for port 8501).
  astra-dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.papertrading
    image: astra-trade-qml:paper
    container_name: astra-dashboard
    volumes:
      - ./logs:/app/logs
      - ./models:/app/models
    ports:
      - "8501:8501"
    command: streamlit run src/dashboard/streamlit_app.py --server.port=8501 --server.address=0.0.0.0
    restart: unless-stopped
