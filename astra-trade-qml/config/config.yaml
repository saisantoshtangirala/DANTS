# Astra-Trade QML - Main Configuration
# Infrastructure: RunPod (Training) + Hetzner (Paper Trading) + Zerodha Kite (Execution)

project:
  name: "Astra-Trade-QML"
  version: "1.0.0"
  timezone: "Asia/Kolkata"
  market: "NSE_INDIA"

infrastructure:
  training_host: "runpod"           # GPU cloud for daily model training
  trading_host: "hetzner"           # VPS for paper trading & live shadow
  broker_api: "zerodha_kite"        # Execution API
  model_sync:
    method: "s3"                    # s3 | scp | rsync
    bucket: "astra-trade-models"
    region: "ap-south-1"
    sync_interval_minutes: 30

data:
  symbols:
    # focus_universe: full pool used for training/feature generation and
    # regime detection (indices included - NIFTY 50 / NIFTY BANK aren't
    # cash-tradable but their trend feeds the regime detector).
    focus_universe:
      - "NIFTY 50"
      - "NIFTY BANK"
      - "RELIANCE"
      - "TCS"
      - "INFY"
      - "HDFCBANK"
      - "ICICIBANK"
      - "SBIN"
      - "BHARTIARTL"
      - "ITC"
    # equity_universe: the actual cash-equity symbols the paper/live
    # trading loop and portfolio allocator are allowed to hold positions
    # in. Deliberately excludes the indices above - you cannot buy "NIFTY
    # 50" as a cash equity, only via futures/options/ETF, none of which
    # this system trades.
    equity_universe:
      - "RELIANCE"
      - "TCS"
      - "INFY"
      - "HDFCBANK"
      - "ICICIBANK"
      - "SBIN"
      - "BHARTIARTL"
      - "ITC"
    fno_universe: []                # Auto-populated from NSE F&O list
    midcap_watchlist: []

  timeframes:
    intraday: "5minute"              # Primary intraday timeframe - stored in Kite's native interval format
                                      # (minute/3minute/5minute/...) since Kite is the primary data source and
                                      # this value is passed to it directly with no translation; yfinance's
                                      # differently-formatted interval strings ("5m") are translated at its call
                                      # site instead (see TrainingPipeline.data_ingestion) - was "5min" (a pandas
                                      # frequency alias, not a Kite interval), silently broken for two reasons:
                                      # main.py's live-trading loop passed it straight to Kite's API (which
                                      # needs "5minute") with no translation, and pipeline.py's yfinance fallback
                                      # passed it straight to yfinance (which needs "5m") with no translation either.
    swing: "1d"                     # Daily timeframe
    features_lookback: 20           # LSTM sequence length (feature indicators handle their own lookback)
    intraday_lookback_days: 365     # History window for 5-min bar ingestion via Kite (chunked into <=55-day
                                     # requests - see _fetch_kite_intraday_chunked - so this isn't capped at
                                     # Kite's own per-request limit). Only Yahoo's separate intraday FALLBACK
                                     # path is hardcapped at 60 calendar days (yfinance's own period="60d",
                                     # unaffected by this value) - this setting only governs the primary Kite
                                     # path. Was 60: with the 80/10/10 date-quantile train/val/OOS split, that
                                     # left only ~41 trading days total and ~4-5 OOS trading days per symbol -
                                     # too few for the confidence-gated (>=0.60) backtest to reach the
                                     # allocator's 20-trade minimum for most symbols (run #63: 7 of 8 symbols
                                     # excluded on trade count alone, not on expectancy). 365 gives ~250
                                     # trading days pooled, ~25 OOS days per symbol.

  liquidity:
    min_adtv_cr: 10                 # Minimum average daily traded value (INR crore) for a symbol to be tradable/allocatable

  sources:
    nse_bhavcopy_url: "https://archives.nseindia.com/content/historical/EQUITIES"
    kite_historical: true           # Use Kite API for historical data
    alternative_data:
      ipo_gmp: "https://www.ipowatch.in"
      fii_dii: "https://www.nseindia.com/reports/fii-dii"

models:
  classical:
    lstm:
      hidden_size: 64
      num_layers: 2
      dropout: 0.4
      learning_rate: 0.0003
      weight_decay: 0.0001         # Adam L2 regularization - was hardcoded in the optimizer regardless of
                                    # config; now a tunable constructor param, so this preserves that same
                                    # effective value now that LSTMModel defaults to 0.0 if unset
      batch_size: 64
      epochs: 100
      early_stopping_patience: 15

    xgboost:
      max_depth: 5
      learning_rate: 0.02
      n_estimators: 500
      subsample: 0.8
      colsample_bytree: 0.8
      objective: "binary:logistic"

  quantum:
    backend: "qiskit"               # qiskit | pennylane
    simulator: "aer_simulator"      # aer_simulator | statevector_simulator
    shots: 1024
    max_qubits: 8                   # Limited by classical simulation
    feature_map: "ZZFeatureMap"     # ZZFeatureMap | PauliFeatureMap
    ansatz: "EfficientSU2"          # EfficientSU2 | RealAmplitudes
    reps: 2                         # Repetitions of ansatz layers
    optimizer: "SPSA"               # SPSA | L-BFGS-B | COBYLA
    max_iter: 100
    quantum_batch_size: 32

    # Hybrid integration weights
    classical_weight: 0.7
    quantum_weight: 0.3

    # Fallback: if quantum simulation fails
    fallback_to_classical: true
    fallback_threshold_accuracy: 0.55

  ensemble:
    method: "weighted_average"      # weighted_average | stacking | voting
    meta_learner: "logistic_regression"
    cv_folds: 5

signals:
  # Dead zone must exceed the real round-trip cost floor (~0.22% at this
  # account's ~Rs.5,000 position size - see CostCalculator), or the model
  # is trained to call directions on moves too small to ever be
  # profitable even when predicted perfectly. 0.4% leaves real margin
  # above that floor for an edge to actually be worth capturing.
  noise_threshold: 0.004
  # Widening this to 10 bars (50min) was tried and reverted: every
  # sub-model's val accuracy got WORSE (LSTM 56.7%->41.5%, XGBoost F1
  # 51.2%->37.8%, quantum kernel 58.7%->49.3%, VQC 60.1%->52.4%), and
  # training samples dropped 62% (7752->2959) from the combination of
  # this and the wider noise_threshold. The longer horizon didn't
  # surface cleaner signal - it just left less, harder-to-predict data.
  # Reverted to isolate whether the noise_threshold/cost fixes alone
  # help, changing one variable at a time instead of several at once.
  forward_periods: 5                # Bars ahead for the label (5 x 5-min bars = 25-minute forward horizon)

  confidence:
    min_threshold: 0.60             # Minimum confidence to execute (matches medium tier)
    tiers:
      high: { min: 0.75, action: "execute_full" }
      medium: { min: 0.60, action: "execute_half" }
      low: { min: 0.50, action: "queue_review" }

    weights:
      model_probability: 0.30
      ensemble_agreement: 0.25
      regime_alignment: 0.20
      historical_expectancy: 0.15
      liquidity_score: 0.10

  targets:
    intraday:
      profit_target_pct: 0.01       # 1%
      stop_loss_pct: 0.01           # 1%
      trailing_stop_pct: 0.005      # 0.5%

    swing:
      profit_target_pct: 0.05       # 5%
      stop_loss_pct: 0.03           # 3%
      trailing_stop_pct: 0.02       # 2%

  intraday:
    no_new_entry_after: "15:00"     # Stop opening new positions this late; not enough session left to reach target/exit cleanly
    square_off_time: "15:15"        # Force-close every open position by this time, ahead of the 15:30 close

trading:
  mode: "paper"                     # paper | live_shadow | live
  capital:
    initial: 50000                  # INR 50,000 monthly trading capital
    monthly_profit_target_inr: 10000  # Reporting target only (20%/month) - never used to size trades or bias signals
    currency: "INR"

  position_sizing:
    method: "kelly_fraction"
    max_risk_per_trade_pct: 0.02    # 2% max risk
    kelly_fraction: 0.25            # Quarter Kelly for safety
    max_position_size_pct: 0.10     # 10% of capital max per position

  allocator:
    min_backtest_trades: 20         # Minimum OOS backtest trades before a symbol is trusted with real capital
    max_symbols: 5                  # Spread capital across at most this many symbols

  costs:
    brokerage_per_order: 20         # Zerodha intraday cap: ₹20 per order...
    brokerage_pct_cap: 0.0003       # ...or 0.03% of turnover, WHICHEVER IS LOWER (the percentage side applies at this account's position sizes)
    stt_pct: 0.00025                # 0.025% on sell side (intraday) - was 0.001 (0.1%), the delivery rate wrongly applied to intraday: a 4x overstatement
    stt_delivery_pct: 0.001         # 0.1% both sides (delivery)
    gst_pct: 0.18                   # 18% on brokerage + transaction charges
    transaction_charges_pct: 0.0000345 # 0.00345% NSE transaction charges (was stored as 0.00345 = 0.345%, a 100x overstatement vs. every other cost line here following "decimal fraction = commented percent / 100")
    sebi_charges_pct: 0.000001      # ₹10 per crore (10 / 1,00,00,000)
    stamp_duty_pct: 0.00015         # 0.015% on buy side (Maharashtra)
    slippage_pct: 0.0005            # 0.05% estimated slippage

  risk_management:
    daily_loss_limit_pct: 0.03      # 3% daily loss limit → halt
    consecutive_loss_limit: 3       # 3 consecutive losses → reduce size 50%
    vix_spike_threshold: 25         # India VIX > 25 → exit directional
    max_drawdown_pct: 0.12          # 12% max drawdown → halt all
    max_open_positions: 5           # Max 5 concurrent positions
    circuit_breaker_action: "cancel_all_pending"

  schedule:
    pre_market: "09:00"
    market_open: "09:15"
    market_close: "15:30"
    post_market: "15:30"
    training_window: "16:30-23:30"  # Non-trading hours

training:
  daily_schedule:
    - { time: "16:30", task: "data_ingestion" }
    - { time: "17:00", task: "feature_engineering" }
    - { time: "18:00", task: "classical_training" }
    - { time: "20:00", task: "quantum_optimization" }
    - { time: "22:00", task: "ensemble_optimization" }
    - { time: "23:00", task: "backtest_validation" }
    - { time: "23:30", task: "model_deployment" }

  evolution:
    enabled: true
    nas_frequency_days: 30          # Neural Architecture Search monthly
    feature_evolution: true         # Genetic programming for features
    regime_submodels: true          # Train separate models per regime
    quantum_depth_adaptation: true  # Auto-adjust circuit depth

  validation:
    # OFF by default in the daily pipeline: each walk-forward fold retrains
    # the FULL ensemble from scratch, including the quantum kernel and VQC
    # (each already costs 10-30 minutes for a single fit in the main daily
    # training run). walk_forward_windows folds means that many full
    # quantum retrains in one run - run #62 (the run this was first wired
    # into the daily pipeline) hit the 3-hour training-pod timeout mid-fold
    # 2 of 6 and was killed (exit=124). Run TrainingPipeline.walk_forward_validation()
    # manually/periodically instead (e.g. monthly, matching the "6-month
    # rolling window" comment below) until it has a lightweight
    # classical-only mode cheap enough to run nightly.
    walk_forward_enabled: false
    walk_forward_windows: 6         # 6-month rolling window
    out_of_sample_pct: 0.20         # 20% OOS
    paper_trading_months: 6         # 6-month incubation

ipo:
  enabled: true
  mode: "paper_only"                # Never automate IPOs live (regulatory risk)
  data_sources:
    - "ipo_watch"
    - "chittorgarh"
    - "nse_ipo_calendar"
  features:
    - gmp_trend
    - subscription_ratio_retail
    - subscription_ratio_qib
    - subscription_ratio_hni
    - issue_size
    - sector_momentum_5d
    - market_sentiment_vix
  prediction_target: "listing_day_return_pct"
  min_confidence: 0.65

logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: "logs/astra_trade.log"
  max_bytes: 10485760               # 10MB
  backup_count: 10
  database: "sqlite:///logs/astra_trade.db"

dashboard:
  enabled: true
  port: 8501
  refresh_interval_seconds: 30
  metrics:
    - pnl_chart
    - confidence_distribution
    - regime_timeline
    - quantum_circuit_metrics
    - trade_journal
    - model_performance