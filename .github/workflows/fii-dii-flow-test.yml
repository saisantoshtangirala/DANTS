name: FII/DII Institutional-Flow Diagnostic (CI Runner)

# The strategy this session's exploratory analysis of NSE's daily
# FII/DII institutional-flow data actually found, rather than a
# strategy shape picked from a template and tested against data (every
# earlier diagnostic this session did the latter, and every one of
# them - except a since-debunked momentum result - came back null).
#
# DII's 5-day change in net NIFTY index-futures open interest (from
# NSE's public participant-wise OI disclosure) predicts NIFTY 50's
# forward return: Bonferroni-corrected IC across 120 feature/horizon
# combinations, positive and significant in both halves of a 5-year
# window, NOT recycled price momentum (a multiple regression keeps the
# DII feature significant at p<0.001 while trailing momentum drops out
# entirely), and survives a realistic one-day publication-to-execution
# lag. See TrainingPipeline.fii_dii_flow_backtest()'s docstring and
# src/training/fii_dii_flow.py for the full methodology.
#
# Uniquely among this session's diagnostics, needs NO Kite session -
# both data sources (src/data/participant_oi.py, src/data/index_close.py)
# hit NSE's public archives directly. That data fetch (~5 years, one
# request per trading day per source) is the slow part of this
# workflow - empirically ~11-12 minutes per source fetching cold, so
# timeout-minutes is set well above that.
#
# No ML model training at all, so like the other recent diagnostics this
# runs directly on a plain ubuntu-latest runner - no RunPod GPU pod.
#
# workflow_dispatch only - a one-off (or occasional, re-run manually)
# research question, not a recurring production job.
on:
  workflow_dispatch: {}

concurrency:
  group: fii-dii-flow-test
  cancel-in-progress: false

jobs:
  fii-dii-flow-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r astra-trade-qml/requirements/requirements-fii-dii-flow.txt

      - name: Run fii-dii-flow diagnostic
        working-directory: astra-trade-qml
        # set -o pipefail: without it, `python3 ... | tee log` reports the
        # PIPELINE's exit code as tee's (always 0), masking a crash behind
        # a green step - the exact bug already found and fixed in
        # pairs-trading-test.yml.
        run: |
          set -o pipefail
          python3 -u -m src.main --mode fii-dii-flow-test | tee /tmp/fii_dii_flow_test.log

      - name: Summarize fii-dii-flow run
        if: always()
        run: |
          {
            echo "### FII/DII institutional-flow diagnostic run"
            echo
            echo '```'
            grep -E "fii_dii_flow_test_started|fii_dii_flow_test_sample_size|fii_dii_flow_test_result|fii_dii_flow_test_complete" /tmp/fii_dii_flow_test.log \
              || echo "(no matching result lines captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
