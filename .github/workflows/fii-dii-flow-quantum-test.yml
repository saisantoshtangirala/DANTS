name: FII/DII Institutional-Flow Quantum/ML Diagnostic (CI Runner)

# Does a genetically-evolved feature set + this codebase's existing
# quantum kernel classifier (src/models/quantum/quantum_kernel.py, the
# same one already used in the production LSTM+XGBoost+quantum
# ensemble) beat fii-dii-flow-test.yml's frozen single-feature rule -
# the one currently live in paper trading (fii-dii-flow-paper.yml)?
# See TrainingPipeline.fii_dii_flow_quantum_backtest()'s docstring and
# src/training/fii_dii_flow_quantum.py for the full walk-forward
# methodology and the explicit adoption gate: this diagnostic does NOT
# change what's live in paper trading either way - see its
# "comparison" result for the verdict/recommendation, and the fallback
# (periodic walk-forward re-calibration of the existing rule) if it
# doesn't beat the benchmark.
#
# Same NSE-archive data sources as fii-dii-flow-test.yml - no Kite
# session needed. Unlike that workflow, this one does real quantum-
# circuit simulation work (qiskit's exact statevector simulator, CPU-
# only - no RunPod GPU pod, QuantumKernelClassifier's own simulation
# doesn't use one) per walk-forward fold, which is genuinely slow: a
# single fold's QSVC fit on a 150-sample kernel matrix alone measured
# ~65s locally at just 2 qubits, before the fold-diagnostic prediction
# pass; the default 4-qubit, 3-fold config used here is expected to
# take considerably longer, hence the generous timeout below relative
# to fii-dii-flow-test.yml's.
#
# No RunPod GPU pod needed (see above), so like the other fii-dii-flow
# workflows this runs directly on a plain ubuntu-latest runner.
#
# workflow_dispatch only - a one-off (or occasional, re-run manually)
# research question, not a recurring production job.
on:
  workflow_dispatch: {}

concurrency:
  group: fii-dii-flow-quantum-test
  cancel-in-progress: false

jobs:
  fii-dii-flow-quantum-test:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r astra-trade-qml/requirements/requirements-fii-dii-flow-quantum.txt

      - name: Run fii-dii-flow quantum/ML diagnostic
        working-directory: astra-trade-qml
        # set -o pipefail: without it, `python3 ... | tee log` reports the
        # PIPELINE's exit code as tee's (always 0), masking a crash behind
        # a green step - the exact bug already found and fixed in
        # pairs-trading-test.yml.
        run: |
          set -o pipefail
          python3 -u -m src.main --mode fii-dii-flow-quantum-test | tee /tmp/fii_dii_flow_quantum_test.log

      - name: Summarize fii-dii-flow quantum/ML run
        id: summarize
        if: always()
        run: |
          RESULT_LINES=$(grep -E "fii_dii_flow_quantum_test_started|fii_dii_flow_quantum_test_sample_size|fii_dii_flow_quantum_test_fold|fii_dii_flow_quantum_test_oos_result|fii_dii_flow_quantum_test_comparison|fii_dii_flow_quantum_test_complete" /tmp/fii_dii_flow_quantum_test.log || echo "(no matching result lines captured)")
          {
            echo "### FII/DII institutional-flow quantum/ML diagnostic run"
            echo
            echo '```'
            echo "$RESULT_LINES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "result_lines<<TELEGRAM_EOF"
            echo "$RESULT_LINES"
            echo "TELEGRAM_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            FII/DII Institutional-Flow Quantum/ML Diagnostic - ${{ job.status }}
            ${{ steps.summarize.outputs.result_lines }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
