name: Train on RunPod and Deploy to Hetzner

# Builds the training image, trains astra-trade-qml's HybridQMLModel on a
# rented RunPod GPU, and deploys the resulting model to the Hetzner
# paper-trading host. See astra-trade-qml/docker/README-style notes in
# scripts/deploy_to_hetzner.sh for the one-time Hetzner setup this
# depends on (a running docker-compose stack + a KITE_* .env file).
#
# NOTE: the schedule below runs this nightly on weekdays, which means
# recurring RunPod GPU spend (typically well under $1/run - see the
# pod's own train_timeout_seconds cap) every trading night. Remove the
# `schedule:` block below (or disable the workflow) if you'd rather
# trigger training manually via workflow_dispatch until you've watched
# a few real runs.
on:
  workflow_dispatch:
    inputs:
      min_vram_gb:
        description: "Minimum GPU VRAM (GB) to select"
        required: false
        default: "12"
  schedule:
    # 16:30 IST = 11:00 UTC, weekdays - matches config.yaml's training_window start.
    - cron: "0 11 * * 1-5"

permissions:
  contents: write
  packages: write
  actions: write  # needed for the docker/build-push-action GHA cache backend

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-training

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: meta
        run: echo "image=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push training image
        uses: docker/build-push-action@v5
        with:
          context: astra-trade-qml
          file: astra-trade-qml/docker/Dockerfile.training
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  train:
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: pip install requests

      - name: Select cheapest available GPU
        id: gpu
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          GPU_IDS=$(python3 astra-trade-qml/scripts/ci/select_gpu.py \
            --min-vram-gb "${{ github.event.inputs.min_vram_gb || '12' }}")
          echo "gpu_ids=$GPU_IDS" >> "$GITHUB_OUTPUT"
          echo "Selected GPUs: $GPU_IDS"

      - name: Launch training pod and wait for completion
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
        run: |
          python3 astra-trade-qml/scripts/ci/launch_training_pod.py \
            --image "${{ needs.build-image.outputs.image }}" \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --gpu-ids-json '${{ steps.gpu.outputs.gpu_ids }}'

  deploy:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check out trained model
        uses: actions/checkout@v4
        with:
          ref: model-artifacts

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy_key
          chmod 600 ~/.ssh/hetzner_deploy_key

      - name: Deploy model to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY_PATH: /home/runner/.ssh/hetzner_deploy_key
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: bash astra-trade-qml/scripts/deploy_to_hetzner.sh
