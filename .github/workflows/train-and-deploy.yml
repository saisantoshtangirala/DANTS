name: Train on RunPod and Deploy to Hetzner

# Trains astra-trade-qml's HybridQMLModel on a rented RunPod GPU and
# deploys the resulting model to the Hetzner paper-trading host.
#
# No custom Docker image or registry: the pod boots from RunPod's public
# runpod/pytorch image and clones the repo + installs dependencies at
# startup (scripts/ci/launch_training_pod.py) - the same pattern already
# validated end-to-end on real GPU hardware for the one-off smoke test
# (scripts/runpod_smoke_test.py). A CI-built image was tried first for a
# faster pod boot but broke twice in ways not worth the added moving
# parts; a few minutes of install time per run is a fine trade for one
# less thing that can fail.
#
# See scripts/hetzner_setup.sh for the one-time Hetzner setup this
# depends on (systemd services + a KITE_* .env file, no Docker needed).
#
# NOTE: the schedule below runs this nightly on weekdays, which means
# recurring RunPod GPU spend (typically well under $1/run - see the
# pod's own train_timeout_seconds cap) every trading night. Remove the
# `schedule:` block below (or disable the workflow) if you'd rather
# trigger training manually via workflow_dispatch until you've watched
# a few real runs.
#
# Deliberately NOT on push: branches: [master] - during active
# development, every commit to master (bugfixes, diagnostics, unrelated
# refactors) would each independently trigger a full production
# train-and-deploy run and live Hetzner redeploy as a side effect of
# just pushing code. Confirmed in practice: 4 separate runs fired this
# way in one session from ordinary bugfix commits, competing for the
# same limited RunPod GPU capacity as intentional diagnostic runs and
# repeatedly redeploying the live paper-trading model without anyone
# deciding to. workflow_dispatch (manual) and the nightly schedule below
# are the only intended triggers now.
on:
  workflow_dispatch:
    inputs:
      min_vram_gb:
        description: "Minimum GPU VRAM (GB) to select"
        required: false
        default: "12"
  schedule:
    # 16:30 IST = 11:00 UTC, weekdays - matches config.yaml's training_window start.
    # Scheduled runs execute against the default branch; set the repo's
    # default branch to 'master' so these cron runs pick up the latest code.
    - cron: "0 11 * * 1-5"

# launch_training_pod.py creates the RunPod pod under a fixed name
# ("astra-trade-qml-training"), not one unique per run - two runs firing
# close together (e.g. the nightly schedule firing right as someone
# triggers workflow_dispatch) collide on that name and can knock each
# other's pod out from under them. Serialize instead of parallelizing: queue the new
# run behind whichever is already in flight rather than cancelling it -
# a half-finished training run silently producing no model is worse than
# a few extra minutes of queue time.
concurrency:
  group: train-and-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    # launch_training_pod.py's own timeouts: up to 3 launch attempts x 30min
    # boot check (worst case, all fail to boot) + the 190min poll-timeout
    # once a pod does boot = up to 280min. Padded above that so the script's
    # own clean failure/retry logic always gets to finish before GitHub's
    # job timeout would hard-kill it mid-retry.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install script dependencies
        run: pip install requests

      - name: Select cheapest available GPU
        id: gpu
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
        run: |
          GPU_IDS=$(python3 astra-trade-qml/scripts/ci/select_gpu.py \
            --min-vram-gb "${{ github.event.inputs.min_vram_gb || '12' }}")
          echo "gpu_ids=$GPU_IDS" >> "$GITHUB_OUTPUT"
          echo "Selected GPUs: $GPU_IDS"

      - name: Generate ephemeral SSH key for pod log streaming
        run: |
          ssh-keygen -t ed25519 -f /tmp/runpod_ssh_key -N "" -q
          chmod 600 /tmp/runpod_ssh_key

      - name: Launch training pod and wait for completion
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KITE_API_KEY: ${{ secrets.KITE_API_KEY }}
          KITE_API_SECRET: ${{ secrets.KITE_API_SECRET }}
          KITE_USER_ID: ${{ secrets.KITE_USER_ID }}
          KITE_PASSWORD: ${{ secrets.KITE_PASSWORD }}
          KITE_TOTP_SECRET: ${{ secrets.KITE_TOTP_SECRET }}
        run: |
          python3 -u astra-trade-qml/scripts/ci/launch_training_pod.py \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --gpu-ids-json '${{ steps.gpu.outputs.gpu_ids }}' \
            --ssh-key-file /tmp/runpod_ssh_key \
            > >(tee /tmp/launch_training_pod.log) 2>&1

      - name: Summarize training run
        id: summarize
        if: always()
        run: |
          RESULT_LINES=$(grep -E "^(Launch attempt|Pod .* (booted|failed to boot|vanished|terminated|still running)|::error::|Training completed successfully)" \
            /tmp/launch_training_pod.log || echo "(no matching status lines captured)")
          {
            echo "### Training run"
            echo
            echo "GPU candidates: \`${{ steps.gpu.outputs.gpu_ids }}\`"
            echo
            echo '```'
            echo "$RESULT_LINES"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          {
            echo "result_lines<<TELEGRAM_EOF"
            echo "$RESULT_LINES"
            echo "TELEGRAM_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Train-and-Deploy: training job - ${{ job.status }}
            GPU candidates: ${{ steps.gpu.outputs.gpu_ids }}
            ${{ steps.summarize.outputs.result_lines }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  deploy:
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Check out scripts and source
        uses: actions/checkout@v4

      - name: Fetch trained model from model-artifacts branch
        run: |
          git fetch origin model-artifacts
          git checkout origin/model-artifacts -- astra-trade-qml/models/latest

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/hetzner_deploy_key
          chmod 600 ~/.ssh/hetzner_deploy_key

      - name: Deploy model to Hetzner
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY_PATH: /home/runner/.ssh/hetzner_deploy_key
          HETZNER_SSH_PORT: ${{ secrets.HETZNER_SSH_PORT }}
        run: bash astra-trade-qml/scripts/deploy_to_hetzner.sh

      - name: Notify Telegram
        if: always()
        uses: ./.github/actions/telegram-notify
        with:
          bot_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat_id: ${{ secrets.TELEGRAM_CHAT_ID }}
          message: |
            Train-and-Deploy: deploy to Hetzner - ${{ job.status }}

            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
